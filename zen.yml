console_title_template: '{{ .PWD }}'
version: 4
final_space: true

blocks:
  - type: 'prompt'
    alignment: 'left'
    newline: true

    segments: 
      - type: 'path'
        style: 'plain'
        background: 'transparent'
        foreground: 'blue'
        template: '{{ .Path }}'

        options: 
          style: 'full'

      - type: 'git'
        style: 'plain'
        background: 'transparent'
        foreground: '#6c6c6c'
        template: ' {{ .HEAD }}<cyan>{{ if or (.Working.Changed) (.Staging.Changed) }}*{{ end }} {{ if gt .Behind 0 }}⇣{{ end }}{{ if gt .Ahead 0 }}⇡{{ end }}</>'

        options:
          branch_icon: ''
          fetch_status: true
    
  - type: 'rprompt'
    overflow: 'hidden'
    
    segments:
      - type: 'executiontime'
        style: 'plain'
        foreground: 'yellow'
        background: 'transparent'
        template: '{{ .FormattedMs }}'

        options:
          threshold: 5000

  - type: 'prompt'
    alignment: 'left'
    newline: true

    segments:
      - type: 'text'
        style: 'plain'
        background: 'transparent'
        foreground_templates: 
          - '{{if gt .Code 0}}red{{end}}'
          - '{{if eq .Code 0}}magenta{{end}}'
        template: '⟩'

transient_prompt:
  background: 'transparent'
  foreground_templates:
    - '{{if gt .Code 0}}red{{end}}'
    - '{{if eq .Code 0}}magenta{{end}}'
  template: '⟩ '
